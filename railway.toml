# Monorepo: Express serves apps/display/dist (and host/player). Root build is required.
# https://docs.railway.app/reference/config-as-code

[build]
# Railpack mounts Vite caches at apps/*/node_modules/.vite during the *build* step; never `rm` or `npm ci` there
# (EBUSY). Install runs in a separate Railpack step; this command is only `npm run build`.
buildCommand = "sh scripts/railway-build.sh"

[deploy]
# Node must be the main process. `npm start` catches Railway's stop signal and
# exits as a failed command, so every redeploy emails a crash for the old one.
startCommand = "node apps/server/dist/index.js"
# Seconds between SIGTERM and SIGKILL. The server saves, then exits 0 inside this window.
drainingSeconds = 10
# Railway keeps the old deploy serving until the new one answers this, so a bad build cannot replace a working one.
healthcheckPath = "/health"
healthcheckTimeout = 120
